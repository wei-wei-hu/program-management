<title>Program Status Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: summary-first ledger. Headline + decisions on top, projects sorted red→yellow→green, live 30-second check in a side rail. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --ink:#17201C; --muted:#5A6761; --line:#D3DAD4;
  --accent:#1F5C46; --accent-ink:#FFFFFF;
  --g:#2E8656; --y:#AD7605; --r:#BF3A2B; --g-bg:#E1F1E7; --y-bg:#FAEFD3; --r-bg:#FAE2DE;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161C19; --sunk:#1D2421; --ink:#E3EAE6; --muted:#93A29B; --line:#2A3430;
  --accent:#7CC6A2; --accent-ink:#0F1412;
  --g:#5CC28A; --y:#E3B23F; --r:#F07563; --g-bg:#15301F; --y-bg:#33290F; --r-bg:#3A1915; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161C19; --sunk:#1D2421; --ink:#E3EAE6; --muted:#93A29B; --line:#2A3430;
  --accent:#7CC6A2; --accent-ink:#0F1412;
  --g:#5CC28A; --y:#E3B23F; --r:#F07563; --g-bg:#15301F; --y-bg:#33290F; --r-bg:#3A1915; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
.top .lede{max-width:56ch;margin:6px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--r);border-color:var(--r)}
.btn.sm{padding:4px 10px;font-size:13px}
.period{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.period input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 9px;min-width:0;width:16em;max-width:100%}

/* overview */
.overview{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-top:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.counts{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.count{display:flex;align-items:baseline;gap:7px}
.count b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.count.g b{color:var(--g)}.count.y b{color:var(--y)}.count.r b{color:var(--r)}
.count.t b{color:var(--ink)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin:4px 0 14px}
.bar i{display:block;height:100%}
.bar .r{background:var(--r)}.bar .y{background:var(--y)}.bar .g{background:var(--g)}
.summary{font-size:17px;line-height:1.5;margin:0;font-weight:500}
.summary-edit{width:100%;min-height:84px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:10px;resize:vertical}
.row-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.formula{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.dlist{display:grid;gap:12px;margin-top:10px}
.ditem{border-top:1px solid var(--line);padding-top:12px}
.ditem:first-child{border-top:0;padding-top:0}
.ditem .q{font-weight:600}
.opts{display:grid;gap:4px;margin:6px 0;font-size:14px}
.opt{display:flex;gap:8px;align-items:flex-start}
.opt .k{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-top:2px;flex:none}
.opt.rec .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.due{font-family:var(--f-mono);font-size:12.5px}
.due.late{color:var(--r);font-weight:500}
.due.soon{color:var(--y);font-weight:500}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;margin-top:28px;align-items:start}
.section{margin-bottom:28px}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head .badge{transform:translateY(3px)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:14px}

.badge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;flex:none;font-family:var(--f-body)}
.badge.g{background:var(--g)}.badge.y{background:var(--y)}.badge.r{background:var(--r)}
:root[data-theme="dark"] .badge{color:#0F1412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#0F1412}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.card-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.card.r .card-head{background:var(--r-bg)}
.card.y .card-head{background:var(--y-bg)}
.card-title{flex:1;min-width:0}
.card-title h3{overflow-wrap:anywhere}
.card-title p{margin:2px 0 0;color:var(--muted);font-size:14px}
.card-body{padding:4px 16px 14px;display:grid;gap:12px}
.block{display:grid;gap:4px}
.block .label{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ledger{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:14px}
.ledger dt{color:var(--muted)}
.ledger dd{margin:0;overflow-wrap:anywhere}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab > div{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px}
.ab > div.rec{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ab .k{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ab .tag{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-left:6px}
.next{font-size:14px;background:var(--sunk);border-radius:7px;padding:9px 11px}
.next b{font-weight:600}
.green-line{display:flex;gap:12px;align-items:center;padding:11px 16px;flex-wrap:wrap}
.green-line .gl-main{flex:1;min-width:0;font-size:14px}
.green-line .gl-main b{font-family:var(--f-display);font-size:15.5px;font-weight:600;margin-right:6px}
.flags{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.flag{font-size:12.5px;border:1px solid var(--y);color:var(--y);border-radius:999px;padding:2px 9px;background:transparent}
.flag.bad{border-color:var(--r);color:var(--r)}

/* check rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.check{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.check details{border-top:1px solid var(--line)}
.check li:first-child details{border-top:0}
.check summary{display:flex;gap:10px;align-items:flex-start;padding:8px 0;list-style:none;cursor:pointer;font-size:14px}
.check summary::-webkit-details-marker{display:none}
.mark{flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px;border:1.5px solid var(--line)}
.mark.ok{background:var(--g);border-color:var(--g);color:var(--surface)}
.mark.no{border-color:var(--r);color:var(--r)}
.check .issues{margin:0 0 10px 30px;padding:0;list-style:none;font-size:13px;color:var(--muted);display:grid;gap:4px}
.check .issues button{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:2px;text-align:left}
.score{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.method{margin-top:14px;font-size:13.5px}
.method summary{cursor:pointer;font-weight:600}
.method table{border-collapse:collapse;width:100%;margin-top:8px}
.method td{border-top:1px solid var(--line);padding:7px 4px;vertical-align:top}
.method td:first-child{width:36px}
.method .badge{width:22px;height:22px;font-size:11px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,15,13,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-body{padding:16px 20px;display:grid;gap:16px}
.dlg-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.dlg-foot .grp{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:500}
.field .hint{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.field textarea{min-height:60px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:0;display:grid;gap:12px;min-width:0}
legend{font-family:var(--f-display);font-weight:600;padding:0 6px}
.optional{border:1px solid var(--line);border-radius:9px}
.optional > summary{padding:11px 14px;cursor:pointer;font-family:var(--f-display);font-weight:600;display:flex;justify-content:space-between;gap:10px}
.optional > summary .muted{font-family:var(--f-body);font-weight:400;font-size:13px}
.optional > div{padding:0 14px 14px;display:grid;gap:12px}
.status-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-pick label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px;cursor:pointer}
.status-pick input{position:absolute;opacity:0;pointer-events:none}
.status-pick input:checked + label{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.status-pick input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.status-pick .badge{width:22px;height:22px;font-size:11px}
.suggest{font-size:13px;color:var(--muted)}
.suggest b{color:var(--ink)}
.out{width:100%;min-height:340px;font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:10px;white-space:pre;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:10}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .overview{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .grid2,.ab{grid-template-columns:1fr}
  .ledger{grid-template-columns:minmax(0,1fr)}
  .ledger dt{margin-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="t-eyebrow"></div>
      <h1 id="t-title"></h1>
      <p class="lede" id="t-lede"></p>
      <div class="period">
        <label for="period" class="eyebrow" id="t-period"></label>
        <input id="period" type="text">
      </div>
    </div>
    <div class="tools">
      <button class="btn" id="btn-data" type="button"></button>
      <button class="btn" id="btn-add" type="button"></button>
      <button class="btn primary" id="btn-copy" type="button"></button>
    </div>
  </header>

  <section class="overview">
    <div class="panel">
      <div class="eyebrow" id="t-summary"></div>
      <div class="counts" id="counts"></div>
      <div class="bar" id="bar"></div>
      <div id="summary-box"></div>
    </div>
    <div class="panel">
      <div class="eyebrow" id="t-decisions"></div>
      <div class="dlist" id="decisions"></div>
    </div>
  </section>

  <div class="main">
    <main id="projects"></main>
    <aside class="rail">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
          <div>
            <h2 id="t-check"></h2>
            <div class="muted" style="font-size:13px" id="t-checksub"></div>
          </div>
          <div class="score num" id="score"></div>
        </div>
        <ul class="check" id="check"></ul>
        <details class="method">
          <summary id="t-method"></summary>
          <table><tbody id="method"></tbody></table>
          <p class="muted" id="t-method-note" style="margin:10px 0 0"></p>
        </details>
      </div>
    </aside>
  </div>
</div>

<dialog id="dlg-edit" aria-labelledby="dlg-edit-title">
  <form id="form-edit" method="dialog">
    <div class="dlg-head"><h2 id="dlg-edit-title"></h2><button class="btn ghost sm" type="button" data-close>✕</button></div>
    <div class="dlg-body" id="form-body"></div>
    <div class="dlg-foot">
      <div class="grp"><button class="btn danger sm" type="button" id="btn-del"></button><button class="btn sm" type="button" id="btn-dup"></button></div>
      <div class="grp"><button class="btn" type="button" data-close id="btn-cancel"></button><button class="btn primary" type="submit" id="btn-save"></button></div>
    </div>
  </form>
</dialog>

<dialog id="dlg-out" aria-labelledby="dlg-out-title">
  <div class="dlg-head"><h2 id="dlg-out-title"></h2><button class="btn ghost sm" type="button" data-close>✕</button></div>
  <div class="dlg-body">
    <p class="muted" id="out-note" style="margin:0"></p>
    <textarea class="out" id="out" spellcheck="false"></textarea>
  </div>
  <div class="dlg-foot"><div class="grp" id="out-extra"></div><div class="grp"><button class="btn primary" type="button" id="btn-out-copy"></button></div></div>
</dialog>

<script>
(function(){
const LS = 'program-status-board.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = s => !!String(s ?? '').trim();

/* ---------- copy ---------- */
const T = {
en:{
  eyebrow:'Multi-project progress report', title:'Program Status Board',
  lede:'Status, evidence, risks and decisions on one page. Red projects lead with impact and the decision needed, yellow with the recovery plan, green in one line.',
  period:'Reporting period', data:'Backup', add:'Add project', copy:'Copy report',
  summary:'One-line summary', formula:'Total + status split + key change + most important ask',
  editSummary:'Edit wording', autoSummary:'Back to auto summary', manual:'Edited by hand', done:'Done',
  total:'projects', g:'green', y:'yellow', r:'red',
  decisions:'Decisions needed', noDecisions:'No open decisions. When a project asks for one, it appears here, earliest deadline first.',
  recommended:'recommended', decides:'Decides', by:'by',
  secR:'Red', secRsub:'Impact and the decision needed', secY:'Yellow', secYsub:'Recovery plan and watch points', secG:'Green', secGsub:'New results and next milestone, one line each',
  emptySec:'No projects here.',
  L:{g:'G',y:'Y',r:'R'}, statusName:{g:'Green',y:'Yellow',r:'Red'},
  f:{name:'Project',goal:'Goal this phase',status:'Status',statusNote:'Reason the status differs from the rule',change:'Headline for the summary',changeHint:'A few words, e.g. "passed design review", "1 day late"',
     evidence:'Done this period (evidence)',evidenceHint:'Reviews passed, modules delivered, scope confirmed, flows tested. Skip percentages.',
     nextMilestone:'Next milestone',nextDate:'Milestone date',
     variance:'Plan vs actual',varianceHint:'Fill in when the plan is slipping or expected to slip',plan:'Original plan',actual:'Current actual',impact:'Impact',recovery:'Recovery action',recoveryDate:'Recovery date',
     risk:'Risk',riskHint:'Something that could happen',riskWhat:'What could happen',trigger:'Trigger signal',riskImpact:'Impact on date, scope, quality or cost',response:'Response now',owner:'Owner',due:'Follow up by',
     blocker:'Blocker',blockerHint:'Work has already stopped',missing:'Missing input or decision',source:'Who provides it',affects:'Milestone held up, starting when',needBy:'Latest needed',fallback:'Fallback if it is late',
     decision:'Decision request',decisionHint:'Ask a question someone can answer',question:'What needs deciding',a:'Option A',b:'Option B',rec:'Recommendation and why',decider:'Who decides',decideBy:'Decide by',
     next:'Next step',nextHint:'Action + deliverable + owner + due + done-when',verb:'Action',deliverable:'Deliverable',nextOwner:'Owner',nextDue:'Due',criteria:'Done when'},
  filled:'filled', optional:'optional',
  edit:'Edit', editTitle:'Edit project', newTitle:'New project', save:'Save', cancel:'Cancel', del:'Delete', delConfirm:'Click again to delete', dup:'Duplicate',
  suggest:'Status rule suggests', suggestMatch:'matches the rule',
  evidence:'Evidence', nextMs:'Next milestone', nextStep:'Next step', doneWhen:'Done when',
  check:'30-second check', checkSub:'Runs on every edit', method:'How status is set',
  methodRows:{r:'Work has stopped (open blocker), or the next milestone needs a decision to stay reachable.',y:'Plan and actual have diverged, or a slip is expected. An expected miss goes yellow before it happens.',g:'On plan for the next milestone with no open blocker.'},
  methodNote:'Status follows one rule across all projects, so they can be compared. To override it, write the reason in the project.',
  C:['First screen shows project total and status split','Red / yellow / green follow one rule','Every project shows milestone evidence','Variances state impact and recovery','Risks state trigger and owner','Blockers state who provides and latest time','Requests are answerable questions','Next steps have an owner and date','Red projects sit before green ones','No real sensitive information'],
  enforced:'Handled by the board',
  M:{noStatus:'no status',mismatch:s=>`set to ${s.set}, rule suggests ${s.sug}; add a reason or change it`,noEvidence:'no evidence for this period',pct:'reports a percentage; name the milestone instead',vague:'vague wording ("ongoing", "in progress"); state what was finished',
     varImpact:'variance has no impact',varRecovery:'variance has no recovery action',varDate:'recovery has no date',
     riskTrigger:'risk has no trigger signal',riskOwner:'risk has no owner',riskDue:'risk has no follow-up date',
     blkSource:'blocker does not say who provides it',blkNeed:'blocker has no latest-needed time',blkFallback:'blocker has no fallback',
     decOpts:'decision needs options A and B',decWho:'decision does not name who decides',decDue:'decision has no deadline',decVague:'"please advise" is not a question; offer A or B',redNoAsk:'red project with no decision request or blocker',
     nextOwner:'next step has no owner',nextDue:'next step has no due date',nextWhat:'next step has no deliverable',nextLate:'next step is past due',
     sensitive:'looks like personal or sensitive data (email, phone, ID, password)'},
  late:'overdue', inH:h=>`in ${h}h`, inD:d=>`in ${d}d`, inM:m=>`in ${m}m`,
  outTitle:'Report text', outNote:'Copied to your clipboard. It is also here to paste into email, chat or a doc.', outNoteFail:'Your browser blocked the clipboard. Select the text below and copy it.',
  copied:'Report copied', copyAgain:'Copy again',
  dataTitle:'Backup and restore', dataNote:'This board saves in this browser only. Copy the text below to keep a backup or move it to another device; paste a backup and press Restore to load it.',
  restore:'Restore', restored:'Board restored', badJson:'That text is not a board backup. Paste the full text you copied.', loadSample:'Load sample projects', sampleLoaded:'Sample projects loaded', copyJson:'Copy backup',
  sampleBanner:'Sample projects. Edit them or add your own.',
  rpt:{decisions:'DECISIONS NEEDED',evidence:'Evidence',blocker:'Blocker',variance:'Plan vs actual',risk:'Risk',next:'Next step',ms:'Next milestone',recovery:'Recovery',impact:'Impact',fallback:'Fallback',trigger:'Trigger',response:'Response',from:'from',needBy:'needed by',rec:'Recommend'},
  summaryFn:(n,g,y,r,changes,ask)=>{let s=`${n} projects: ${g} green, ${y} yellow, ${r} red.`; if(changes.length) s+=' '+changes.map(c=>c[0]+' '+c[1]).join('; ')+'.'; if(ask) s+=` Need ${ask.who||'a decision'} to decide by ${ask.when}: ${ask.q}`; return s;},
  nextFn:(n,fmt)=>[n.owner, [n.verb,n.deliverable].filter(has).join(' '), n.due?('by '+fmt(n.due)):''].filter(has).join(' · '),
  weekOf:d=>'Week of '+d
}};
const lang = 'en';
const t = k => T.en[k];

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const toLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function baseDay(){
  const d = new Date(); d.setSeconds(0,0);
  const wd = d.getDay();
  if (wd===0) d.setDate(d.getDate()+1);
  else if (wd===6) d.setDate(d.getDate()+2);
  else if (d.getHours()>=15) d.setDate(d.getDate()+(wd===5?3:1));
  return d;
}
function at(offset,h,m){ const d = baseDay(); d.setDate(d.getDate()+offset); d.setHours(h,m||0,0,0); return toLocal(d); }
function parse(s){ if(!has(s)) return null; const d = new Date(s.length===10 ? s+'T00:00' : s); return isNaN(d) ? null : d; }
function fmt(s){
  const d = parse(s); if(!d) return s||'';
  const loc = 'en-US';
  const day = new Intl.DateTimeFormat(loc,{weekday:'short',month:'short',day:'numeric'}).format(d);
  return s.length>10 ? `${day} ${pad(d.getHours())}:${pad(d.getMinutes())}` : day;
}
function rel(s){
  const d = parse(s); if(!d) return {txt:'',cls:''};
  const diff = d - new Date();
  if (diff<0) return {txt:t('late'),cls:'late'};
  const m = Math.round(diff/60000), h = Math.round(diff/3600000);
  if (m<60) return {txt:t('inM')(m),cls:'soon'};
  if (h<24) return {txt:t('inH')(h),cls:h<=8?'soon':''};
  return {txt:t('inD')(Math.round(h/24)),cls:''};
}
function defaultPeriod(){
  const d = baseDay(); const wd = d.getDay(); d.setDate(d.getDate()-((wd+6)%7));
  const loc = 'en-US';
  return t('weekOf')(new Intl.DateTimeFormat(loc,{month:'short',day:'numeric',year:'numeric'}).format(d));
}

/* ---------- rules ---------- */
const anyVar = p => has(p.variance.plan) || has(p.variance.actual);
function suggested(p){
  if (has(p.blocker.missing)) return 'r';
  if (has(p.decision.question) && anyVar(p)) return 'r';
  if (anyVar(p) || has(p.decision.question)) return 'y';
  return 'g';
}
const VAGUE = /\b(ongoing|in progress|on track|continu(e|ing) to|working on|progressing)\b/i;
const ADVISE = /please advise|guidance|your thoughts/i;
const SENS = /[\w.+-]+@[\w-]+\.[\w.-]+|(?:\+?\d[\d\s-]{9,}\d)|\b\d{17}[\dxX]\b|password|passwd/i;
function textOf(p){ const out=[]; (function walk(o){ for(const k in o){ if(k==='id'||k==='status') continue; const v=o[k]; if(v && typeof v==='object') walk(v); else if(typeof v==='string' && !/^\d{4}-\d{2}-\d{2}/.test(v)) out.push(v); } })(p); return out.join(' \n '); }

function lint(p){
  const M = t('M'), I = [];
  const add = (c,m,bad) => I.push({c, m, bad:!!bad});
  if (!['g','y','r'].includes(p.status)) add(0, M.noStatus, 1);
  const sug = suggested(p);
  if (sug!==p.status && !has(p.statusNote)) add(1, M.mismatch({set:t('statusName')[p.status], sug:t('statusName')[sug]}));
  if (!has(p.evidence)) add(2, M.noEvidence, 1);
  else { if (/\d\s*%/.test(p.evidence)) add(2, M.pct); if (VAGUE.test(p.evidence)) add(2, M.vague); }
  if (anyVar(p)){ if(!has(p.variance.impact)) add(3,M.varImpact,1); if(!has(p.variance.recovery)) add(3,M.varRecovery,1); else if(!has(p.variance.recoveryDate)) add(3,M.varDate); }
  if (has(p.risk.what)){ if(!has(p.risk.trigger)) add(4,M.riskTrigger); if(!has(p.risk.owner)) add(4,M.riskOwner,1); if(!has(p.risk.due)) add(4,M.riskDue); }
  if (has(p.blocker.missing)){ if(!has(p.blocker.source)) add(5,M.blkSource,1); if(!has(p.blocker.needBy)) add(5,M.blkNeed,1); if(!has(p.blocker.fallback)) add(5,M.blkFallback); }
  const d = p.decision;
  if (has(d.question)){ if(!has(d.a)||!has(d.b)) add(6,M.decOpts,1); if(!has(d.decider)) add(6,M.decWho); if(!has(d.due)) add(6,M.decDue,1); }
  if ([d.question,d.rec,p.blocker.missing].some(x=>ADVISE.test(x||''))) add(6,M.decVague,1);
  if (p.status==='r' && !has(d.question) && !has(p.blocker.missing)) add(6,M.redNoAsk,1);
  const n = p.next;
  if (!has(n.owner)) add(7,M.nextOwner,1);
  if (!has(n.due)) add(7,M.nextDue,1); else { const dd=parse(n.due); if(dd && dd<new Date()) add(7,M.nextLate); }
  if (!has(n.deliverable)) add(7,M.nextWhat);
  if (SENS.test(textOf(p))) add(9,M.sensitive,1);
  return I;
}

const ORDER = {r:0,y:1,g:2};
const sorted = () => state.projects.map((p,i)=>({p,i})).sort((a,b)=>ORDER[a.p.status]-ORDER[b.p.status] || a.i-b.i).map(x=>x.p);
const counts = () => { const c={g:0,y:0,r:0}; state.projects.forEach(p=>c[p.status]=(c[p.status]||0)+1); return c; };
const openDecisions = () => state.projects.filter(p=>has(p.decision.question)).sort((a,b)=>(parse(a.decision.due)||Infinity)-(parse(b.decision.due)||Infinity));
const shortName = p => (p.name||'').split(/\s*[·:]\s*/)[0] || p.name;

function autoSummary(){
  const c = counts(), n = state.projects.length;
  const changes = sorted().filter(p=>has(p.change)).slice(0,3).map(p=>[shortName(p), p.change]);
  const d = openDecisions()[0];
  const ask = d ? {who:d.decision.decider, when:fmt(d.decision.due), q:shortName(d)+' · '+d.decision.question} : null;
  return t('summaryFn')(n,c.g,c.y,c.r,changes,ask);
}
const summaryText = () => has(state.summaryOverride) ? state.summaryOverride : autoSummary();

function flagsHtml(p){

}
function ledger(rows){ const r = rows.filter(x=>has(x[1])); return r.length ? `<dl class="ledger">${r.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl>` : ''; }

function cardFull(p){
  const F = t('f'), v = p.variance, k = p.risk, b = p.blocker, d = p.decision, parts = [];
  const blkB = has(b.missing) ? `<div class="block"><span class="label">${esc(F.blocker)}</span>${ledger([[F.missing,b.missing],[F.source,b.source],[F.affects,b.affects],[F.needBy,fmt(b.needBy)],[F.fallback,b.fallback]])}</div>` : '';
  let decB = '';
  if (has(d.question)){
    const recA = /^\s*A\b/i.test(d.rec), recB = /^\s*B\b/i.test(d.rec);
    decB = `<div class="block"><span class="label">${esc(F.decision)}</span><div style="font-weight:600">${esc(d.question)}</div>
      <div class="ab"><div class="${recA?'rec':''}"><span class="k">A</span>${recA?`<span class="tag">${esc(t('recommended'))}</span>`:''}<div>${esc(d.a)}</div></div>
      <div class="${recB?'rec':''}"><span class="k">B</span>${recB?`<span class="tag">${esc(t('recommended'))}</span>`:''}<div>${esc(d.b)}</div></div></div>
      ${ledger([[F.rec,d.rec],[F.decider,d.decider],[F.decideBy,fmt(d.due)]])}</div>`;
  }
  const varB = anyVar(p) ? `<div class="block"><span class="label">${esc(F.variance)}</span>${ledger([[F.plan,v.plan],[F.actual,v.actual],[F.impact,v.impact],[F.recovery,[v.recovery, v.recoveryDate?('· '+fmt(v.recoveryDate)):''].filter(has).join(' ')]])}</div>` : '';
  const riskB = has(k.what) ? `<div class="block"><span class="label">${esc(F.risk)}</span>${ledger([[F.riskWhat,k.what],[F.trigger,k.trigger],[F.riskImpact,k.impact],[F.response,k.response],[F.owner,[k.owner,k.due?fmt(k.due):''].filter(has).join(' · ')]])}</div>` : '';
  const evB = `<div class="block"><span class="label">${esc(t('evidence'))}</span><div>${esc(p.evidence)||'<span class="muted">—</span>'}</div></div>`;
  const nl = nextLine(p.next);
  const nextB = `<div class="next"><b>${esc(t('nextStep'))}:</b> ${esc(nl)||'—'}${has(p.next.criteria)?`<br><span class="muted">${esc(t('doneWhen'))}: ${esc(p.next.criteria)}</span>`:''}${has(p.nextMilestone)?`<br><span class="muted">${esc(t('nextMs'))}: ${esc(p.nextMilestone)}${p.nextDate?' · '+esc(fmt(p.nextDate)):''}</span>`:''}</div>`;
  if (p.status==='r') parts.push(decB, blkB, varB, riskB, evB, nextB);
  else parts.push(varB, riskB, blkB, decB, evB, nextB);
  return `<article class="card ${p.status}" id="card-${p.id}">
    <div class="card-head">${badge(p.status)}<div class="card-title"><h3>${esc(p.name)||'—'}</h3>${has(p.goal)?`<p>${esc(p.goal)}</p>`:''}${has(p.statusNote)?`<p><em>${esc(p.statusNote)}</em></p>`:''}</div>
    <button class="btn sm" type="button" data-edit="${p.id}">${esc(t('edit'))}</button></div>
    <div class="card-body">${parts.join('')}</div>${flagsHtml(p)}</article>`;
}

function renderCheck(){
  const C = t('C'), buckets = C.map(()=>[]);
  state.projects.forEach(p => lint(p).forEach(i => buckets[i.c].push({p, m:i.m})));
  const auto = {0: state.projects.length>0 && has(summaryText()), 8: true};
  let pass = 0;
  $('#check').innerHTML = C.map((label,i)=>{
    const issues = buckets[i], ok = (i in auto) ? (auto[i] && !issues.length) : !issues.length;
    if (ok) pass++;
    const inner = issues.length ? `<ul class="issues">${issues.map(x=>`<li><button type="button" data-edit="${x.p.id}">${esc(shortName(x.p))}</button>: ${esc(x.m)}</li>`).join('')}</ul>`
      : (i in auto ? `<ul class="issues"><li>${esc(t('enforced'))}</li></ul>` : '');
    return `<li><details ${issues.length?'open':''}><summary><span class="mark ${ok?'ok':'no'}">${ok?'✓':issues.length}</span><span>${esc(label)}</span></summary>${inner}</details></li>`;
  }).join('');
  $('#score').textContent = `${pass}/10`;
}

      <div class="grid2">${inp('n-verb',F.verb,n.verb)}${inp('n-deliverable',F.deliverable,n.deliverable)}${inp('n-owner',F.nextOwner,n.owner)}${inp('n-due',F.nextDue,n.due,'datetime-local')}${inp('n-criteria',F.criteria,n.criteria,'text','',true)}</div></fieldset>
    ${optSection('variance',F.variance,F.varianceHint,anyVar(p),`<div class="grid2">${inp('v-plan',F.plan,v.plan)}${inp('v-actual',F.actual,v.actual)}${inp('v-impact',F.impact,v.impact,'text','',true)}${inp('v-recovery',F.recovery,v.recovery)}${inp('v-recoveryDate',F.recoveryDate,v.recoveryDate,'datetime-local')}</div>`)}
    ${optSection('risk',F.risk,F.riskHint,has(k.what),`<div class="grid2">${inp('k-what',F.riskWhat,k.what)}${inp('k-trigger',F.trigger,k.trigger)}${inp('k-impact',F.riskImpact,k.impact,'text','',true)}${inp('k-response',F.response,k.response,'text','',true)}${inp('k-owner',F.owner,k.owner)}${inp('k-due',F.due,k.due,'datetime-local')}</div>`)}
    ${optSection('blocker',F.blocker,F.blockerHint,has(b.missing),`<div class="grid2">${inp('b-missing',F.missing,b.missing)}${inp('b-source',F.source,b.source)}${inp('b-affects',F.affects,b.affects)}${inp('b-needBy',F.needBy,b.needBy,'datetime-local')}${inp('b-fallback',F.fallback,b.fallback,'text','',true)}</div>`)}
    ${optSection('decision',F.decision,F.decisionHint,has(d.question),`<div class="grid2">${inp('d-question',F.question,d.question,'text','',true)}${inp('d-a',F.a,d.a,'textarea')}${inp('d-b',F.b,d.b,'textarea')}${inp('d-rec',F.rec,d.rec,'text','Start with A or B, e.g. "A: core flows can be accepted on their own"',true)}${inp('d-decider',F.decider,d.decider)}${inp('d-due',F.decideBy,d.due,'datetime-local')}</div>`)}
  `;
  updateSuggest();
  dlg.showModal();
  setTimeout(()=>{ const f = $('#f-name'); if (f && draftNew) f.focus(); }, 30);
}
function readForm(){
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const st = (document.querySelector('input[name="f-status"]:checked')||{}).value || 'g';
  return mk({id:dlg.dataset.id, name:g('f-name'), goal:g('f-goal'), change:g('f-change'), status:st, statusNote:g('f-statusNote'), evidence:g('f-evidence'), nextMilestone:g('f-nextMilestone'), nextDate:g('f-nextDate'),
    next:{verb:g('n-verb'),deliverable:g('n-deliverable'),owner:g('n-owner'),due:g('n-due'),criteria:g('n-criteria')},
    variance:{plan:g('v-plan'),actual:g('v-actual'),impact:g('v-impact'),recovery:g('v-recovery'),recoveryDate:g('v-recoveryDate')},
    risk:{what:g('k-what'),trigger:g('k-trigger'),impact:g('k-impact'),response:g('k-response'),owner:g('k-owner'),due:g('k-due')},
    blocker:{missing:g('b-missing'),source:g('b-source'),affects:g('b-affects'),needBy:g('b-needBy'),fallback:g('b-fallback')},
    decision:{question:g('d-question'),a:g('d-a'),b:g('d-b'),rec:g('d-rec'),decider:g('d-decider'),due:g('d-due')}});
}
function updateSuggest(){
  const p = readForm(), s = suggested(p), el = $('#suggest');
  if (!el) return;
  el.innerHTML = s===p.status ? `${esc(t('suggest'))} <b>${esc(t('statusName')[s])}</b> · ${esc(t('suggestMatch'))}` : `${esc(t('suggest'))} <b>${esc(t('statusName')[s])}</b>`;
  $('#note-wrap').hidden = s===p.status && !has(p.statusNote);
}
$('#form-body').addEventListener('input', updateSuggest);
$('#form-body').addEventListener('change', updateSuggest);
$('#form-edit').addEventListener('submit', e => {
  e.preventDefault();
  const p = readForm();
  const i = state.projects.findIndex(x=>x.id===p.id);
  if (i>=0) state.projects[i] = p; else state.projects.push(p);
  state.sample = false; save(); dlg.close(); render(); toast(t('save')+' ✓');
});
$('#btn-del').addEventListener('click', () => {
  if (!delArmed){ delArmed = true; $('#btn-del').textContent = t('delConfirm'); return; }
  state.projects = state.projects.filter(x=>x.id!==dlg.dataset.id); state.sample=false; save(); dlg.close(); render();
});
$('#btn-dup').addEventListener('click', () => {
  const p = readForm(); p.id = blank().id; p.name = p.name + (' (copy)');
  state.projects.push(p); state.sample=false; save(); dlg.close(); render(); openEdit(p.id);
});
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', e => e.target.closest('dialog').close()));

/* ---------- report text ---------- */
function reportText(){
  const R = t('rpt'), F = t('f'), L = [];
  const sep = ': ', semi = '; ';
  L.push(`${t('title')} · ${state.period}`, '', summaryText());
  const ds = openDecisions();
  if (ds.length){
    L.push('', R.decisions);
    ds.forEach((p,i)=>{ const d=p.decision; L.push(`${i+1}. ${p.name}${sep}${d.question}`);
      if(has(d.a)) L.push(`   A${sep}${d.a}`); if(has(d.b)) L.push(`   B${sep}${d.b}`);
      if(has(d.rec)) L.push(`   ${R.rec}${sep}${d.rec}`);
      L.push(`   ${[d.decider, has(d.due)?`${t('by')} ${fmt(d.due)}`:''].filter(has).join(' · ')}`); });
  }
  const groups = {r:[],y:[],g:[]}; sorted().forEach(p=>groups[p.status].push(p));
  ['r','y'].forEach(s=>{
    if (!groups[s].length) return;
    L.push('', `${t('sec'+s.toUpperCase()).toUpperCase()} · ${t('sec'+s.toUpperCase()+'sub')}`);
    groups[s].forEach(p=>{
      const v=p.variance,k=p.risk,b=p.blocker;
      L.push(`● ${p.name}${has(p.goal)?` — ${p.goal}`:''}`);
      if (has(p.statusNote)) L.push(`  (${p.statusNote})`);
      if (has(b.missing)) L.push(`  ${R.blocker}${sep}${[b.missing, has(b.source)?`${R.from} ${b.source}`:'', b.affects, has(b.needBy)?`${R.needBy} ${fmt(b.needBy)}`:'', has(b.fallback)?`${R.fallback}${sep}${b.fallback}`:''].filter(has).join(semi)}`);
      if (anyVar(p)) L.push(`  ${R.variance}${sep}${[v.plan, v.actual].filter(has).join(' → ')}${has(v.impact)?`${semi}${R.impact}${sep}${v.impact}`:''}${has(v.recovery)?`${semi}${R.recovery}${sep}${v.recovery}${v.recoveryDate?' ('+fmt(v.recoveryDate)+')':''}`:''}`);
      if (has(k.what)) L.push(`  ${R.risk}${sep}${[k.what, has(k.trigger)?`${R.trigger}${sep}${k.trigger}`:'', k.impact, has(k.response)?`${R.response}${sep}${k.response}`:'', [k.owner, k.due?fmt(k.due):''].filter(has).join(' ')].filter(has).join(semi)}`);
      if (has(p.evidence)) L.push(`  ${R.evidence}${sep}${p.evidence}`);
      const nl = nextLine(p.next); if (has(nl)) L.push(`  ${R.next}${sep}${nl}${has(p.next.criteria)?` (${F.criteria}${sep}${p.next.criteria})`:''}`);
    });
  });
  if (groups.g.length){
    L.push('', `${t('secG').toUpperCase()} · ${t('secGsub')}`);
    groups.g.forEach(p=> L.push(`● ${p.name}${sep}${p.evidence||'—'}${has(p.nextMilestone)?` → ${R.ms}${sep}${p.nextMilestone}${p.nextDate?' '+fmt(p.nextDate):''}`:''}`));
  }
  return L.join('\n');
}

const out = $('#dlg-out');
async function copyText(txt){ try { await navigator.clipboard.writeText(txt); return true; } catch(e){ return false; } }
function showOut(title, note, txt, mode){
  $('#dlg-out-title').textContent = title; $('#out-note').textContent = note; $('#out').value = txt; $('#out').readOnly = mode!=='data';
  $('#btn-out-copy').textContent = mode==='data' ? t('copyJson') : t('copyAgain');
  out.dataset.mode = mode;
  $('#out-extra').innerHTML = mode==='data' ? `<button class="btn" type="button" id="btn-restore">${esc(t('restore'))}</button><button class="btn ghost" type="button" id="btn-sample">${esc(t('loadSample'))}</button>` : '';
  if (!out.open) out.showModal();
}
$('#btn-copy').addEventListener('click', async () => {
  const txt = reportText(); const ok = await copyText(txt);
  showOut(t('outTitle'), ok ? t('outNote') : t('outNoteFail'), txt, 'report');
  if (ok) toast(t('copied')); else { $('#out').focus(); $('#out').select(); }
});
$('#btn-out-copy').addEventListener('click', async () => {
  const ok = await copyText($('#out').value);
  if (ok) toast(t('copied')); else { $('#out').focus(); $('#out').select(); }
});
$('#btn-data').addEventListener('click', () => showOut(t('dataTitle'), t('dataNote'), JSON.stringify(state, null, 2), 'data'));
$('#out-extra').addEventListener('click', e => {
  if (e.target.id==='btn-restore'){
    try { const s = JSON.parse($('#out').value); if (!s || !Array.isArray(s.projects)) throw 0;
      s.projects = s.projects.map(mk); delete s.lang; state = s; save(); out.close(); render(); toast(t('restored'));
    } catch(err){ $('#out-note').textContent = t('badJson'); }
  }
  if (e.target.id==='btn-sample'){ state = fresh(); save(); out.close(); render(); toast(t('sampleLoaded')); }
});

/* ---------- misc events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-edit]'); if (b){ openEdit(b.dataset.edit); return; }
  if (e.target.id==='sum-edit'){ editingSummary = true; renderOverview(); $('#summary-input').focus(); }
  if (e.target.id==='sum-done'){ const v = $('#summary-input').value.trim(); state.summaryOverride = v===autoSummary() ? '' : v; editingSummary=false; save(); renderOverview(); renderCheck(); }
  if (e.target.id==='sum-auto'){ state.summaryOverride=''; editingSummary=false; save(); renderOverview(); renderCheck(); }
});
$('#btn-add').addEventListener('click', () => openEdit(null));
$('#period').addEventListener('input', e => { state.period = e.target.value; save(); });
let tt; function toast(msg){ let el = $('.toast'); if (!el){ el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.textContent = msg; el.hidden=false; clearTimeout(tt); tt = setTimeout(()=>el.hidden=true, 1800); }

state = load();
render();
setInterval(() => { if (!editingSummary) renderOverview(); }, 60000);
})();
</script>
